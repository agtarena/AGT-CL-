
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090611">
<link rel="icon" type="image/png" href="./logo.png?v=2">
<title>Ranking Mensal | AGT Arena</title>

<style>
:root {
  --bg:#090611;
  --purple:#8b35ff;
  --neon:#bd75ff;
  --muted:#aaa0b9;
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  min-height:100vh;
  background-color:#090611;
  background-image:
    linear-gradient(
      rgba(9,6,17,.25),
      rgba(9,6,17,.40)
    ),
    url('./agt-banner2.png');

  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  background-attachment:fixed;

  color:#fff;
  font-family:Arial,sans-serif;
}

header {
  position: relative;
  min-height: 84px;
  padding: 18px 7%;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  border-bottom: 1px solid #392052;
  background: rgba(9,6,17,.82);
  backdrop-filter: blur(8px);
}

.logo {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;

  font-size: clamp(25px, 4vw, 34px);
  font-weight: 1000;
  letter-spacing: 3px;

  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #e5e8ef 30%,
    #aeb5c1 65%,
    #f8f9fc 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;

  filter:
    drop-shadow(0 0 2px rgba(255,255,255,.55))
    drop-shadow(0 0 7px rgba(151,65,255,.65))
    drop-shadow(0 0 13px rgba(116,35,220,.35));
}

.back {
  padding:11px 17px;
  border:1px solid #7135a9;
  border-radius:8px;
  color:#fff;
  background:#171020;
  text-decoration:none;
  font-size:12px;
  font-weight:bold;
}

main {
  width:min(950px,90%);
  margin:55px auto;
}

.heading {
  text-align:center;
  margin-bottom:35px;
}

.heading h1 {
  font-size:clamp(30px,6vw,48px);
  margin-bottom:12px;
  text-shadow:0 0 18px #8b35ff88;
}

.heading h1 span {
  color:#bd75ff;
}

.heading p {
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

.month-info {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.month-selector {
  position:relative;
  display:flex;
  align-items:center;
  gap:9px;
}

.month-selector label {
  color:#d9c8f2;
  font-size:11px;
  font-weight:bold;
}

.month-select {
  appearance:none;
  -webkit-appearance:none;
  min-width:165px;
  padding:11px 35px 11px 13px;
  border:1px solid #8b35ff88;
  border-radius:8px;
  color:#fff;
  background:#21132f;
  font-size:12px;
  font-weight:bold;
  text-transform:capitalize;
  cursor:pointer;
  outline:none;
  box-shadow:0 0 12px #8b35ff18;
}

.month-select:focus {
  border-color:#bd75ff;
  box-shadow:0 0 12px #8b35ff66;
}

.month-select option {
  color:#fff;
  background:#171020;
}

.select-arrow {
  position:absolute;
  right:12px;
  pointer-events:none;
  color:#bd75ff;
  font-size:13px;
}

.status {
  color:#bd75ff;
  background:#8b35ff20;
  border:1px solid #8b35ff66;
  padding:7px 12px;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
}

.ranking-list {
  display:flex;
  flex-direction:column;
  gap:11px;
}

.player {
  display:flex;
  align-items:center;
  gap:13px;
  padding:15px;
  border:1px solid #39234f;
  border-radius:11px;
  background:linear-gradient(110deg,rgba(33,21,47,.94),rgba(16,12,25,.94));
  backdrop-filter:blur(5px);
}

.medal {
  width:43px;
  height:43px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#ffffff0b;
  font-size:21px;
  font-weight:bold;
}

.avatar {
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #8b35ff;
  background:#21152f;
  flex-shrink:0;
}

.info {
  flex:1;
  min-width:0;
}

.nick {
  display:block;
  font-weight:900;
  overflow-wrap:anywhere;
}

.details {
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

.player-stats {
  display:flex;
  align-items:center;
  gap:22px;
  flex-shrink:0;
}

.stat {
  min-width:65px;
  text-align:right;
}

.stat strong {
  display:block;
  font-size:15px;
}

.stat small {
  color:var(--muted);
  font-size:9px;
  font-weight:bold;
  letter-spacing:1px;
}

.stat-score strong,
.stat-points strong {
  color:#bd75ff;
}

.player.rank-1 {
  border-color:#c99b32;
  background:linear-gradient(110deg,rgba(58,43,18,.95),rgba(23,16,27,.95));
}

.player.rank-1 .nick,
.player.rank-1 .stat strong {
  color:#f5cf55;
}

.player.rank-2 {
  border-color:#9ba4b3;
  background:linear-gradient(110deg,rgba(41,45,54,.95),rgba(23,19,30,.95));
}

.player.rank-2 .nick,
.player.rank-2 .stat strong {
  color:#d1d7e1;
}

.player.rank-3 {
  border-color:#a96a3c;
  background:linear-gradient(110deg,rgba(56,34,22,.95),rgba(23,16,27,.95));
}

.player.rank-3 .nick,
.player.rank-3 .stat strong {
  color:#d99a6c;
}

.empty {
  padding:25px 15px;
  color:var(--muted);
  text-align:center;
  line-height:1.7;
  border:1px solid #39234f;
  border-radius:10px;
  background:rgba(21,16,32,.94);
}

.updated {
  margin-top:18px;
  color:#a99bb8;
  font-size:10px;
  text-align:right;
}

footer {
  padding:30px 10px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:2;
  background:rgba(9,6,17,.55);
}

@media(max-width:600px) {
  header {
    padding:15px 5%;
  }

  .logo {
    font-size:21px;
  }

  main {
    margin:40px auto;
  }

  .month-info {
    align-items:flex-start;
  }

  .month-selector {
    width:100%;
  }

  .month-select {
    flex:1;
  }

  .status {
    margin-top:3px;
  }

  .player {
    gap:8px;
    padding:11px 9px;
  }

  .medal,
  .avatar {
    width:35px;
    height:35px;
  }

  .medal {
    font-size:17px;
  }

  .nick {
    font-size:13px;
  }

  .details {
    font-size:9px;
  }

  .player-stats {
    gap:10px;
  }

  .stat {
    min-width:43px;
  }

  .stat strong {
    font-size:12px;
  }

  .stat small {
    font-size:8px;
    letter-spacing:0;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">AGT ARENA</div>
  <a class="back" href="./index.html#ranking">← VOLTAR</a>
</header>

<main>

  <div class="heading">
    <h1>RANKING <span>MENSAL</span></h1>
    <p>
      A evolução dos integrantes da AGT durante o mês.
      Cada jogador soma sua melhor pontuação registrada em cada dia.
    </p>
  </div>

  <div class="month-info">
    <div class="month-selector">
      <label for="month-select">MÊS:</label>
      <select class="month-select" id="month-select"></select>
      <span class="select-arrow">▼</span>
    </div>

    <span class="status" id="month-status">CONECTANDO...</span>
  </div>

  <div class="ranking-list" id="ranking-list">
    <p class="empty">Calculando classificação mensal...</p>
  </div>

  <div class="updated" id="updated"></div>

</main>

<footer>
  <strong>AGT ARENA</strong><br>
  ALIANÇA • GARRA • TALENTO<br>
  © 2026 BY AGT SOUZA
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(async function() {

  const SUPABASE_URL = 'https://lbknsgfpfxkvypkxbcmy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_HMTbt0R6ffjBExr_kdCYDA_xmnU6xXA';

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const list = document.getElementById('ranking-list');
  const status = document.getElementById('month-status');
  const updated = document.getElementById('updated');
  const monthSelect = document.getElementById('month-select');

  let consultaAtual = 0;

  function getBrazilDate() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone:'America/Sao_Paulo',
      year:'numeric',
      month:'2-digit',
      day:'2-digit'
    }).formatToParts(new Date());

    const values = {};
    parts.forEach(part => values[part.type] = part.value);

    return `${values.year}-${values.month}-${values.day}`;
  }

  function formatScore(value) {
    return Number(value || 0).toLocaleString('pt-BR');
  }

  function formatarData(data) {
    const [ano,mes,dia] = data.split('-');
    return `${dia}/${mes}`;
  }

  function criarSeletorMes() {
    const hoje = getBrazilDate();
    const [anoAtual,mesAtual] = hoje.split('-').map(Number);

    const meses = [
      'janeiro','fevereiro','março','abril',
      'maio','junho','julho','agosto',
      'setembro','outubro','novembro','dezembro'
    ];

    monthSelect.innerHTML = '';

    for(let i = 0; i < 60; i++) {
      const data = new Date(
        Date.UTC(anoAtual,mesAtual-1-i,1,12)
      );

      const ano = data.getUTCFullYear();
      const mes = String(data.getUTCMonth()+1).padStart(2,'0');
      const chave = `${ano}-${mes}`;

      const option = document.createElement('option');
      option.value = chave;
      option.textContent = `${meses[data.getUTCMonth()]} de ${ano}`;

      monthSelect.appendChild(option);
    }

    monthSelect.value =
      `${anoAtual}-${String(mesAtual).padStart(2,'0')}`;
  }

  async function buscarCapturas(inicio,fim) {
    let todas = [];
    let pagina = 0;
    const tamanho = 1000;

    while(true) {
      const {data,error} = await db
        .from('agt_ranking_daily')
        .select('nick,score,source_date,fetched_at')
        .gte('source_date',inicio)
        .lte('source_date',fim)
        .order('fetched_at',{ascending:false})
        .range(pagina,pagina+tamanho-1);

      if(error) throw error;

      todas = todas.concat(data || []);

      if(!data || data.length < tamanho) break;

      pagina += tamanho;
    }

    return todas;
  }

  async function carregar() {
    const numeroConsulta = ++consultaAtual;

    const hoje = getBrazilDate();
    const mesEscolhido = monthSelect.value;
    const [ano,mes] = mesEscolhido.split('-').map(Number);

    const inicio = `${mesEscolhido}-01`;
    const mesAtual = hoje.substring(0,7);

    let fim;

    if(mesEscolhido === mesAtual) {
      fim = hoje;
    } else {
      const ultimoDia = new Date(Date.UTC(ano,mes,0)).getUTCDate();
      fim = `${mesEscolhido}-${String(ultimoDia).padStart(2,'0')}`;
    }

    status.textContent = 'CALCULANDO...';
    updated.textContent = '';

    list.innerHTML =
      '<p class="empty">Calculando classificação mensal...</p>';

    try {
      const [capturasResult,perfisResult] = await Promise.all([
        buscarCapturas(inicio,fim),
        db.from('agt_profiles').select('nick,avatar_url')
      ]);

      if(numeroConsulta !== consultaAtual) return;

      const perfis = {};

      (perfisResult.data || []).forEach(profile => {
        if(profile.nick) {
          perfis[profile.nick.trim().toLowerCase()] =
            profile.avatar_url;
        }
      });

      const melhorPorDia = new Map();

      capturasResult.forEach(player => {
        const nick = (player.nick || '').trim();

        if(!nick || !/agt/i.test(nick)) return;

        const chave =
          `${nick.toLowerCase()}|${player.source_date}`;

        const score = Number(player.score || 0);

        if(
          !melhorPorDia.has(chave) ||
          score > melhorPorDia.get(chave).score
        ) {
          melhorPorDia.set(chave,{
            nick,
            score,
            source_date:player.source_date
          });
        }
      });

      const totais = new Map();

      melhorPorDia.forEach(item => {
        const chave = item.nick.toLowerCase();

        if(!totais.has(chave)) {
          totais.set(chave,{
            nick:item.nick,
            total:0,
            datas:[]
          });
        }

        const jogador = totais.get(chave);

        jogador.total += item.score;
        jogador.datas.push(item.source_date);
      });

      const ranking = Array.from(totais.values())
        .sort((a,b) => b.total-a.total);

      ranking.forEach(player => player.datas.sort());

      list.innerHTML = '';

      if(!ranking.length) {
        status.textContent = 'SEM DADOS';

        list.innerHTML =
          '<p class="empty">Ainda não existem pontuações registradas para este mês.</p>';

        return;
      }

      const medalhas = ['🥇','🥈','🥉'];

      ranking.forEach((player,index) => {
        const item = document.createElement('div');
        item.className = 'player';

        if(index < 3) {
          item.classList.add(`rank-${index+1}`);
        }

        const medal = document.createElement('div');
        medal.className = 'medal';
        medal.textContent = medalhas[index] || `${index+1}º`;

        const avatarUrl = perfis[player.nick.toLowerCase()];

        if(avatarUrl) {
          const avatar = document.createElement('img');
          avatar.className = 'avatar';
          avatar.src = avatarUrl;
          avatar.alt = 'Foto de ' + player.nick;
          avatar.loading = 'lazy';

          item.appendChild(medal);
          item.appendChild(avatar);
        } else {
          item.appendChild(medal);
        }

        const info = document.createElement('div');
        info.className = 'info';

        const nick = document.createElement('span');
        nick.className = 'nick';
        nick.textContent = player.nick;

        const details = document.createElement('span');
        details.className = 'details';
        details.textContent =
          'Dias: ' + player.datas.map(formatarData).join(' • ');

        info.append(nick,details);

        const stats = document.createElement('div');
        stats.className = 'player-stats';

        const score = document.createElement('div');
        score.className = 'stat stat-score';

        const scoreValue = document.createElement('strong');
        scoreValue.textContent = formatScore(player.total);

        const scoreLabel = document.createElement('small');
        scoreLabel.textContent = 'SCORE';

        score.append(scoreValue,scoreLabel);

        const points = document.createElement('div');
        points.className = 'stat stat-points';

        const pointsValue = document.createElement('strong');
        pointsValue.textContent = '0';

        const pointsLabel = document.createElement('small');
        pointsLabel.textContent = 'PONTOS';

        points.append(pointsValue,pointsLabel);

        stats.append(score,points);

        item.append(info,stats);
        list.appendChild(item);
      });

      status.textContent = 'ATUALIZADO';

      updated.textContent = 'Última consulta: ' +
        new Date().toLocaleTimeString('pt-BR',{
          timeZone:'America/Sao_Paulo',
          hour:'2-digit',
          minute:'2-digit'
        });

    } catch(error) {
      console.error(error);

      if(numeroConsulta !== consultaAtual) return;

      status.textContent = 'ERRO NA LEITURA';

      list.innerHTML =
        '<p class="empty">Não foi possível carregar o ranking. Verifique a conexão e as permissões do Supabase.</p>';
    }
  }

  criarSeletorMes();

  monthSelect.addEventListener('change',carregar);

  await carregar();

  setInterval(function() {
    const hoje = getBrazilDate();
    const mesAtual = hoje.substring(0,7);

    if(monthSelect.value === mesAtual) {
      carregar();
    }
  },60000);

})();
</script>

</body>
</html>
